    opts: ["اسناد عادی را باطل می‌کند", "اسناد عادی راجع به اموال غیرمنقول در محدوده ثبت اجباری در ادارات و محاکم پذیرفته نمی‌شود", "اسناد عادی را معتبر می‌داند", "اسناد عادی را به رسمی تبدیل می‌کند"],
    ans: 1,
    exp: "ماده ۴۸ قانون ثبت مقرر می‌کند که اسناد عادی راجع به اموال غیرمنقول واقع در حوزه‌های ثبت اجباری در ادارات و محاکم پذیرفته نمی‌شود."
  }
];

let current = 0, correct = 0, wrong = 0, answered = [];

function render() {
  const area = document.getElementById('quizArea');
  if (current >= questions.length) { showResult(); return; }
  const q = questions[current];
  document.getElementById('progressBar').style.width = ((current / questions.length) * 100) + '%';
  area.innerHTML = `
    <div class="question-box">
      <div class="q-counter">سوال ${toPersian(current + 1)} از ${toPersian(questions.length)}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">
        ${q.opts.map((o, i) => `<button class="opt-btn" onclick="choose(${i})">${o}</button>`).join('')}
      </div>
      <div class="explanation" id="exp">${q.exp}</div>
      <button class="next-btn" id="nextBtn" onclick="next()">
        ${current === questions.length - 1 ? 'مشاهده نتیجه آزمون ←' : 'سوال بعدی ←'}
      </button>
    </div>`;
}

function choose(i) {
  const q = questions[current];
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);
  if (i === q.ans) { btns[i].classList.add('correct'); correct++; answered.push(1); }
  else { btns[i].classList.add('wrong'); btns[q.ans].classList.add('correct'); wrong++; answered.push(0); }
  document.getElementById('exp').style.display = 'block';
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function next() { current++; render(); }

function showResult() {
  const skipped = questions.length - correct - wrong;
  const rawScore = correct - (wrong * 0.33);
  const pct = Math.max(0, (rawScore / questions.length) * 100).toFixed(1);
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizArea').innerHTML = `
    <div class="result-box">
      <h2>نتیجه آزمون</h2>
      <div class="result-grid">
        <div class="stat green"><div class="num">${toPersian(correct)}</div><div class="lbl">✅ پاسخ صحیح</div></div>
        <div class="stat red"><div class="num">${toPersian(wrong)}</div><div class="lbl">❌ پاسخ غلط</div></div>
        <div class="stat gray"><div class="num">${toPersian(skipped)}</div><div class="lbl">⬜ نزده</div></div>
        <div class="stat blue"><div class="num">${toPersian(pct)}٪</div><div class="lbl">📊 درصد (با نمره منفی)</div></div>
      </div>
      <div class="score-line">نمره خام: ${toPersian(rawScore.toFixed(2))} از ${toPersian(questions.length)}</div>
      <p style="font-size:.85rem;color:#888;">فرمول: درست − (غلط × ۰.۳۳)</p>
      <a href="jalase-1-point.html" style="display:inline-block;margin-top:1rem;padding:.7rem 1.5rem;background:#4a90d9;color:#fff;border-radius:8px;text-decoration:none;">بازگشت به نکات جلسه</a>
      <a href="index.html" style="display:inline-block;margin-top:1rem;margin-right:.5rem;padding:.7rem 1.5rem;background:#eee;color:#333;border-radius:8px;text-decoration:none;">فهرست جلسات</a>
    </div>`;
}

function toPersian(n) {
  return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

render();
</script>
</body>
</html>
