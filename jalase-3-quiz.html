    opts: ["چون سند رسمی است، سازنده هیچ دفاعی نمی‌تواند مطرح کند.", "دفاع او مبنی بر عدم انجام تعهد طرف مقابل قابل استماع است.", "فقط می‌تواند امضای خود را انکار کند.", "فقط می‌تواند به اداره ثبت شکایت انتظامی کند."],
    answer: 1,
    exp: "متعهدِ سند رسمی می‌تواند به تعهد متقابلِ انجام‌نشده از ناحیه طرف مقابل استناد کند و دادگاه باید رسیدگی کند."
  },
  {

    opts: ["سازنده متعهدله و پیش‌خریدار متعهد است.", "هر دو متعهدله هستند.", "سازنده متعهد و پیش‌خریدار متعهدله است.", "هر دو فقط متعامل‌اند و عنوان تعهدی ندارند."],
    answer: 2,
    exp: "استاد صریحاً هشدار می‌دهد که در این مثال، سازنده = متعهد و پیش‌خریدار = متعهدله است و نباید این دو جابه‌جا شوند."

    opts: ["باید همیشه خسارت احتمالی تودیع کند.", "نیازی به تودیع خسارت احتمالی ندارد.", "فقط با اجازه رئیس حوزه قضایی از تودیع معاف است.", "فقط در دعاوی خانوادگی از تودیع معاف است."],

let current = 0;
let answers = new Array(questions.length).fill(null);

function toFarsiNum(n) {
  return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function renderQuestion() {
  const q = questions[current];
  const userAns = answers[current];
  document.getElementById('counter').textContent = `سوال ${toFarsiNum(current+1)} از ${toFarsiNum(questions.length)}`;
  document.getElementById('progress').style.width = ((current+1)/questions.length*100) + '%';

  let optsHtml = q.opts.map((opt, i) => {
    let cls = '';
    if (userAns !== null) {
      if (i === q.answer) cls = 'correct';
      else if (i === userAns) cls = 'wrong';
    }
    return `<label class="${cls}">
      <input type="radio" name="opt" value="${i}" ${userAns !== null ? 'disabled' : ''} ${userAns === i ? 'checked' : ''}>
      ${opt}
    </label>`;
  }).join('');

  document.getElementById('question-container').innerHTML = `
    <div class="question-card">
      <div class="question-text">${q.q}</div>
      <div class="options">${optsHtml}</div>
      <div class="explanation" id="exp" style="display:${userAns !== null ? 'block' : 'none'}">
        💡 ${q.exp}
      </div>
    </div>`;

  if (userAns === null) {
    document.querySelectorAll('input[name="opt"]').forEach(r => {
      r.addEventListener('change', () => selectAnswer(parseInt(r.value)));
    });
  }

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').textContent = current === questions.length - 1 ? 'مشاهده نتیجه' : 'بعدی';
}

function selectAnswer(idx) {
  answers[current] = idx;
  renderQuestion();
}

function navigate(dir) {
  if (dir === 1 && current === questions.length - 1) {
    showResult();
    return;
  }
  current = Math.max(0, Math.min(questions.length - 1, current + dir));
  renderQuestion();
}

function showResult() {
  let correct = 0, wrong = 0, skip = 0;
  answers.forEach((a, i) => {
    if (a === null) skip++;
    else if (a === questions[i].answer) correct++;
    else wrong++;
  });
  const score = Math.max(0, correct - wrong * 0.33).toFixed(2);
  const pct = ((score / questions.length) * 100).toFixed(1);

  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'block';
  document.getElementById('result-area').innerHTML = `
    <div class="result-card">
      <h2>نتیجه آزمون جلسه سوم</h2>
      <div class="result-score">${toFarsiNum(score)}</div>
      <div style="color:#666;margin-bottom:16px">از ${toFarsiNum(questions.length)} سوال</div>
      <div class="result-stats">
        <div class="stat-item stat-correct">✅ صحیح: ${toFarsiNum(correct)}</div>
        <div class="stat-item stat-wrong">❌ غلط: ${toFarsiNum(wrong)}</div>
        <div class="stat-item stat-skip">➖ نزده: ${toFarsiNum(skip)}</div>
      </div>
      <div style="font-size:1.2rem;margin:12px 0">درصد: <strong>${toFarsiNum(pct)}٪</strong></div>
      <div style="margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="restartQuiz()">تلاش مجدد</button>
        <a href="jalase-3-point.html" class="btn btn-secondary">مطالعه نکات</a>
        <a href="index.html" class="btn btn-secondary">فهرست جلسات</a>
      </div>
    </div>`;
}

function restartQuiz() {
  current = 0;
  answers = new Array(questions.length).fill(null);
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('result-area').style.display = 'none';
  renderQuestion();
}

renderQuestion();
</script>
