    q: "در صورتی که در مرکز استان، کانون سردفتران و دفتریاران وجود نداشته باشد، نظر مشورتی لازم برای انتصاب سردفتر را چه کسی ارائه می‌کند؟",
    opts: ["رئیس دادگستری استان", "فرماندار", "دفتریار اول", "دادستان محل"],
    answer: 3,
    exp: "این استثنا را جداگانه حفظ کنید؛ نبود کانون = دادستان محل."
  },
  {
    q: "اصلاح قانون تسهیل صدور مجوزهای کسب‌وکار نسبت به قانون دفاتر اسناد رسمی، بنابر این جلسه، ناظر به کدام ماده بوده است؟",
    opts: ["ماده ۲", "ماده ۵", "ماده ۷۳", "ماده ۱۲۸۷"],
    answer: 1,
    exp: "قانون تسهیل فقط ماده ۵ را اصلاح کرده، نه ماده ۲ را."
  },
  {
    q: "اثر اصلاح ماده ۵ قانون دفاتر اسناد رسمی به‌موجب قانون تسهیل چیست؟",
    opts: ["حذف نظر مشورتی کانون", "حذف کامل مصاحبه، اختبار و ابلاغ", "برداشتن قید ظرفیت و برگزاری سالانه آزمون", "واگذاری انتصاب سردفتر به سردفتران شاغل"],
    answer: 2,
    exp: "دام مهم این است که تصور شود قانون تسهیل همه مراحل انتصاب را حذف کرده؛ درحالی‌که فقط بحث ظرفیت را تغییر داده است."
  },
  {
    q: "دفتریار اول از حیث جایگاه حقوقی چه سمتی دارد؟",
    opts: ["هم معاون سردفتر است و هم نماینده سازمان ثبت در دفترخانه", "فقط کارمند دفترخانه است", "فقط نماینده کانون سردفتران است", "صرفاً قائم‌مقام رئیس دادگستری است"],
    answer: 0,
    exp: "دوگانه بودن سمت دفتریار اول، از نکات مهم و پرسش‌خیز است."
  },
  {
    q: "کدام گزینه درباره تفاوت دفتریار اول و دفتریار دوم صحیح است؟",
    opts: ["هر دو به پیشنهاد سازمان ثبت و ابلاغ رئیس قوه قضاییه منصوب می‌شوند", "هر دو الزامی‌اند و هر دو ۱۵ درصد حق‌التحریر می‌گیرند", "دفتریار دوم نماینده سازمان ثبت است ولی دفتریار اول نیست", "دفتریار اول الزامی و دارای ۱۵ درصد حق‌التحریر است؛ دفتریار دوم اختیاری و مشمول قانون کار است"],
    answer: 3,
    exp: "سه تفاوت را با هم حفظ کنید: الزامی/اختیاری، ۱۵ درصد حق‌التحریر/حقوق کارگری، و جایگاه نمایندگی سازمان ثبت."
  }
];

let current = 0;
let answers = new Array(questions.length).fill(null);

function toFarsiNum(n) {
  return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function renderQuestion() {
  const q = questions[current];
  const userAns = answers[current];
  document.getElementById('counter').textContent = `سوال ${toFarsiNum(current+1)} از ${toFarsiNum(questions.length)}`;
  document.getElementById('progress').style.width = ((current+1)/questions.length*100) + '%';

  let optsHtml = q.opts.map((opt, i) => {
    let cls = '';
    if (userAns !== null) {
      if (i === q.answer) cls = 'correct';
      else if (i === userAns) cls = 'wrong';
    }
    return `<label class="${cls}">
      <input type="radio" name="opt" value="${i}" ${userAns !== null ? 'disabled' : ''} ${userAns === i ? 'checked' : ''}>
      ${opt}
    </label>`;
  }).join('');

  document.getElementById('question-container').innerHTML = `
    <div class="question-card">
      <div class="question-text">${q.q}</div>
      <div class="options">${optsHtml}</div>
      <div class="explanation" id="exp" style="display:${userAns !== null ? 'block' : 'none'}">
        💡 ${q.exp}
      </div>
    </div>`;

  if (userAns === null) {
    document.querySelectorAll('input[name="opt"]').forEach(r => {
      r.addEventListener('change', () => selectAnswer(parseInt(r.value)));
    });
  }

  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').textContent = current === questions.length - 1 ? 'مشاهده نتیجه' : 'بعدی';
}

function selectAnswer(idx) {
  answers[current] = idx;
  renderQuestion();
}

function navigate(dir) {
  if (dir === 1 && current === questions.length - 1) {
    showResult();
    return;
  }
  current = Math.max(0, Math.min(questions.length - 1, current + dir));
  renderQuestion();
}

function showResult() {
  let correct = 0, wrong = 0, skip = 0;
  answers.forEach((a, i) => {
    if (a === null) skip++;
    else if (a === questions[i].answer) correct++;
    else wrong++;
  });
  const score = Math.max(0, correct - wrong * 0.33).toFixed(2);
  const pct = ((score / questions.length) * 100).toFixed(1);

  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'block';
  document.getElementById('result-area').innerHTML = `
    <div class="result-card">
      <h2>نتیجه آزمون جلسه چهارم</h2>
      <div class="result-score">${toFarsiNum(score)}</div>
      <div style="color:#666;margin-bottom:16px">از ${toFarsiNum(questions.length)} سوال</div>
      <div class="result-stats">
        <div class="stat-item stat-correct">✅ صحیح: ${toFarsiNum(correct)}</div>
        <div class="stat-item stat-wrong">❌ غلط: ${toFarsiNum(wrong)}</div>
        <div class="stat-item stat-skip">➖ نزده: ${toFarsiNum(skip)}</div>
      </div>
      <div style="font-size:1.2rem;margin:12px 0">درصد: <strong>${toFarsiNum(pct)}٪</strong></div>
      <div style="margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="restartQuiz()">تلاش مجدد</button>
        <a href="jalase-4-point.html" class="btn btn-secondary">مطالعه نکات</a>
        <a href="index.html" class="btn btn-secondary">فهرست جلسات</a>
      </div>
    </div>`;
}

function restartQuiz() {
  current = 0;
  answers = new Array(questions.length).fill(null);
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('result-area').style.display = 'none';
  renderQuestion();
}

renderQuestion();
</script>
