<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون جلسه ششم</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; color: #1a202c; padding: 20px; }
  .quiz-container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  h1 { text-align: center; color: #2d3748; margin-bottom: 8px; font-size: 1.5rem; }
  .subtitle { text-align: center; color: #718096; margin-bottom: 24px; font-size: 0.9rem; }
  .progress-bar { background: #e2e8f0; border-radius: 8px; height: 8px; margin-bottom: 24px; }
  .progress-fill { background: #4299e1; height: 100%; border-radius: 8px; transition: width 0.3s; }
  .question-counter { text-align: center; color: #718096; margin-bottom: 16px; font-size: 0.9rem; }
  .question-text { font-size: 1.05rem; font-weight: 600; color: #2d3748; margin-bottom: 20px; line-height: 1.7; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px;
    background: #fff; cursor: pointer; text-align: right; font-size: 0.95rem;
    color: #2d3748; transition: all 0.2s; line-height: 1.5;
  }
  .option-btn:hover:not(:disabled) { border-color: #4299e1; background: #ebf8ff; }
  .option-btn.correct { border-color: #48bb78; background: #f0fff4; color: #276749; }
  .option-btn.wrong { border-color: #fc8181; background: #fff5f5; color: #9b2c2c; }
  .option-btn:disabled { cursor: default; }
  .explanation {
    margin-top: 16px; padding: 14px; background: #fffbeb; border-right: 4px solid #f6ad55;
    border-radius: 8px; font-size: 0.9rem; color: #744210; line-height: 1.7; display: none;
  }
  .explanation.show { display: block; }
  .nav-buttons { display: flex; justify-content: space-between; margin-top: 24px; gap: 12px; }
  .nav-btn {
    padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 0.95rem; font-weight: 600; transition: all 0.2s;
  }
  .btn-next { background: #4299e1; color: #fff; }
  .btn-next:hover { background: #3182ce; }
  .btn-prev { background: #e2e8f0; color: #4a5568; }
  .btn-prev:hover { background: #cbd5e0; }
  .btn-next:disabled, .btn-prev:disabled { opacity: 0.4; cursor: default; }
  .result-screen { text-align: center; padding: 20px; display: none; }
  .result-screen.show { display: block; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: 700; color: #fff;
  }
  .score-excellent { background: #48bb78; }
  .score-good { background: #4299e1; }
  .score-poor { background: #fc8181; }
  .result-title { font-size: 1.4rem; font-weight: 700; color: #2d3748; margin-bottom: 8px; }
  .result-detail { color: #718096; margin-bottom: 24px; }
  .btn-restart { background: #4299e1; color: #fff; border: none; padding: 12px 32px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; }
  .btn-restart:hover { background: #3182ce; }
  .question-screen { display: block; }
  .question-screen.hide { display: none; }
</style>
</head>
<body>
<div class="quiz-container">
  <h1>آزمون جلسه ششم</h1>
  <p class="subtitle">دفاتر اسناد رسمی — شرایط اشتغال، تضمین و کانون</p>

  <div class="question-screen" id="questionScreen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question-counter" id="questionCounter"></div>
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="explanation" id="explanation"></div>
    <div class="nav-buttons">
      <button class="nav-btn btn-prev" id="prevBtn" onclick="navigate(-1)">◄ قبلی</button>
      <button class="nav-btn btn-next" id="nextBtn" onclick="navigate(1)">بعدی ►</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="score-circle" id="scoreCircle"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-detail" id="resultDetail"></div>
    <button class="btn-restart" onclick="restart()">شروع مجدد</button>
  </div>
</div>

    explanation: "مجموع اعضا ۱۰ نفر است: ۷ سردفتر و ۳ دفتریار."
  },
  {
    q: "ترکیب اعضای اصلی و علی‌البدل کانون کدام است؟",
    options: ["۵ سردفتر اصلی، ۲ سردفتر علی‌البدل، ۲ دفتریار اصلی، ۱ دفتریار علی‌البدل","۵ سردفتر اصلی، ۱ سردفتر علی‌البدل، ۳ دفتریار اصلی، ۱ دفتریار علی‌البدل","۴ سردفتر اصلی، ۳ سردفتر علی‌البدل، ۲ دفتریار اصلی، ۱ دفتریار علی‌البدل","۵ سردفتر اصلی، ۲ سردفتر علی‌البدل، ۳ دفتریار اصلی، بدون عضو علی‌البدل"],
    answer: 0,
    explanation: "این سؤال را آزمون‌سازها معمولاً با جابه‌جایی جزئی اعداد طراحی می‌کنند."
  },
  {
    q: "کدام گزینه درباره هیئت مدیره کانون صحیح است؟",
    options: ["تمام ۷ عضو اصلی هیئت مدیره دارای سمت خاص هستند","رئیس، نایب‌رئیس، خزانه‌دار و دبیر از میان همه اعضا اعم از سردفتر و دفتریار انتخاب می‌شوند","مکاتبات کانون با امضای رئیس و امور مالی با امضای مشترک رئیس و خزانه‌دار است","دوره تصدی اعضای هیئت مدیره دو سال و انتخاب مجدد آنان ممنوع است"],
    answer: 2,
    explanation: "سمت‌های خاص از میان سردفتران عضو هیئت مدیره انتخاب می‌شوند. مکاتبات با امضای رئیس و امور مالی با امضای مشترک رئیس و خزانه‌دار است. مدت تصدی سه سال و انتخاب مجدد بلامانع است."
  }
];

let current = 0;
let userAnswers = new Array(questions.length).fill(null);

function render() {
  const q = questions[current];
  document.getElementById('progressFill').style.width = ((current + 1) / questions.length * 100) + '%';
  document.getElementById('questionCounter').textContent = `سؤال ${current + 1} از ${questions.length}`;
  document.getElementById('questionText').textContent = q.q;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = `${['۱','۲','۳','۴'][i]}) ${opt}`;
    btn.onclick = () => selectAnswer(i);
    if (userAnswers[current] !== null) {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add('correct');
      else if (i === userAnswers[current]) btn.classList.add('wrong');
    }
    container.appendChild(btn);
  });

  const exp = document.getElementById('explanation');
  if (userAnswers[current] !== null) {
    exp.textContent = `📝 نکته آزمونی: ${q.explanation}`;
    exp.classList.add('show');
  } else {
    exp.classList.remove('show');
  }

  document.getElementById('prevBtn').disabled = current === 0;
  const isLast = current === questions.length - 1;
  const nextBtn = document.getElementById('nextBtn');
  if (isLast && userAnswers[current] !== null) {
    nextBtn.textContent = 'مشاهده نتیجه ◄';
  } else {
    nextBtn.textContent = 'بعدی ►';
  }
  nextBtn.disabled = userAnswers[current] === null && !isLast ? false : (userAnswers[current] === null && isLast);
}

function selectAnswer(i) {
  if (userAnswers[current] !== null) return;
  userAnswers[current] = i;
  render();
}

function navigate(dir) {
  if (dir === 1 && current === questions.length - 1) {
    showResult(); return;
  }
  current = Math.max(0, Math.min(questions.length - 1, current + dir));
  render();
}

function showResult() {
  document.getElementById('questionScreen').classList.add('hide');
  const rs = document.getElementById('resultScreen');
  rs.classList.add('show');
  const correct = userAnswers.filter((a, i) => a === questions[i].answer).length;
  const pct = Math.round(correct / questions.length * 100);
  const circle = document.getElementById('scoreCircle');
  circle.textContent = `${pct}%`;
  circle.className = 'score-circle ' + (pct >= 70 ? (pct >= 85 ? 'score-excellent' : 'score-good') : 'score-poor');
  document.getElementById('resultTitle').textContent = pct >= 85 ? 'عالی! 🎉' : pct >= 70 ? 'خوب! 👍' : 'نیاز به مطالعه بیشتر 📚';
  document.getElementById('resultDetail').textContent = `${correct} پاسخ صحیح از ${questions.length} سؤال`;
}

function restart() {
  current = 0;
  userAnswers.fill(null);
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('questionScreen').classList.remove('hide');
  render();
}

render();
</script>
</body>
</html>
