<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون جلسه ششم - مقررات ثبتی</title>
<link rel="stylesheet" href="style.css">
<style>
.quiz-container{max-width:800px;margin:0 auto;padding:20px}
.question-card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:20px}
.question-text{font-size:1.1rem;font-weight:600;margin-bottom:20px;line-height:1.8;color:#1a1a2e}
.options{display:flex;flex-direction:column;gap:10px}
.options label{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:8px;border:2px solid #e0e0e0;cursor:pointer;transition:all .2s;font-size:.95rem}
.options label:hover{border-color:#4361ee;background:#f0f3ff}
.options input[type="radio"]{accent-color:#4361ee}
.correct{border-color:#2dc653!important;background:#f0fff4!important;color:#1a7a3a}
.wrong{border-color:#e63946!important;background:#fff0f0!important;color:#c1121f}
.explanation{margin-top:16px;padding:12px 16px;background:#fffbea;border-right:4px solid #f4a261;border-radius:6px;font-size:.9rem;line-height:1.7;color:#555}
.nav-buttons{display:flex;gap:12px;justify-content:space-between;margin-top:16px}
.btn{padding:10px 24px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;font-family:inherit;transition:all .2s}
.btn-primary{background:#4361ee;color:#fff}
.btn-primary:hover{background:#3451d1}
.btn-secondary{background:#e0e0e0;color:#333}
.btn-secondary:hover{background:#ccc}
.btn:disabled{opacity:.4;cursor:not-allowed}
.progress-bar{background:#e0e0e0;border-radius:99px;height:8px;margin-bottom:16px}
.progress-fill{background:#4361ee;height:8px;border-radius:99px;transition:width .3s}
.question-counter{font-size:.9rem;color:#888;margin-bottom:8px}
.result-card{background:#fff;border-radius:12px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center}
.result-score{font-size:2.5rem;font-weight:700;color:#4361ee;margin:16px 0}
.result-stats{display:flex;justify-content:center;gap:24px;margin:20px 0}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.9rem}
.stat-correct{color:#2dc653}
.stat-wrong{color:#e63946}
.stat-skip{color:#888}
.back-link{display:inline-block;margin-bottom:20px;color:#4361ee;text-decoration:none;font-size:.9rem}
.back-link:hover{text-decoration:underline}
h1{font-size:1.4rem;color:#1a1a2e;margin-bottom:20px}
</style>
</head>
<body>
<div class="quiz-container">
  <a href="index.html" class="back-link">→ بازگشت به فهرست جلسات</a>

    <div class="nav-buttons">

let current = 0;
let answers = new Array(questions.length).fill(null);

function toFarsiNum(n) {
  return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('counter').textContent = `سؤال ${toFarsiNum(current + 1)} از ${toFarsiNum(questions.length)}`;
  document.getElementById('progress').style.width = `${((current + 1) / questions.length) * 100}%`;

  const answered = answers[current] !== null;
  let html = `<div class="question-card"><div class="question-text">${toFarsiNum(current + 1)}. ${q.q}</div><div class="options">`;

  q.opts.forEach((opt, i) => {
    let cls = '';
    if (answered) {
      if (i === q.answer) cls = 'correct';
      else if (i === answers[current]) cls = 'wrong';
    }
    html += `<label class="${cls}"><input type="radio" name="opt" ${answered ? 'disabled' : ''} ${answers[current] === i ? 'checked' : ''} onchange="selectAnswer(${i})"> ${opt}</label>`;
  });

  html += '</div>';
  if (answered) html += `<div class="explanation">💡 ${q.exp}</div>`;
  html += '</div>';

  document.getElementById('question-container').innerHTML = html;
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').textContent = current === questions.length - 1 ? 'مشاهده نتیجه' : 'بعدی';
}

function selectAnswer(idx) {
  answers[current] = idx;
  renderQuestion();
}

function navigate(dir) {
  if (dir === 1 && current === questions.length - 1) { showResult(); return; }
  current = Math.max(0, Math.min(questions.length - 1, current + dir));
  renderQuestion();
}

function showResult() {
  let correct = 0, wrong = 0, skip = 0;
  answers.forEach((a, i) => {
    if (a === null) skip++;
    else if (a === questions[i].answer) correct++;
    else wrong++;
  });
  const score = Math.max(0, correct - wrong * 0.33).toFixed(2);
  const pct = ((score / questions.length) * 100).toFixed(1);

  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'block';
  document.getElementById('result-area').innerHTML = `
    <div class="result-card">
      <h2>نتیجه آزمون جلسه ششم</h2>
      <div class="result-score">${toFarsiNum(score)} از ${toFarsiNum(questions.length)}</div>
      <div style="color:#888;margin-bottom:12px">درصد: ${toFarsiNum(pct)}٪</div>
      <div class="result-stats">
        <div class="stat-item stat-correct">✅ صحیح<br><strong>${toFarsiNum(correct)}</strong></div>
        <div class="stat-item stat-wrong">❌ غلط<br><strong>${toFarsiNum(wrong)}</strong></div>
        <div class="stat-item stat-skip">⬜ نزده<br><strong>${toFarsiNum(skip)}</strong></div>
      </div>
      <button class="btn btn-primary" onclick="restartQuiz()">تلاش مجدد</button>
      <br><br>
      <a href="jalase-6-point.html" class="back-link">📖 مطالعه نکات جلسه ششم</a>
      <br>
      <a href="index.html" class="back-link">→ بازگشت به فهرست جلسات</a>
    </div>`;
}

function restartQuiz() {
  current = 0;
  answers = new Array(questions.length).fill(null);
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('result-area').style.display = 'none';
  renderQuestion();
}

renderQuestion();
</script>
</body>
